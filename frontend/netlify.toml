[build]
  command = "npm run build"
  publish = ".next"


[[plugins]]
  package = "@netlify/plugin-nextjs"
# Proxy API requests through the frontend origin. The browser stays on
# betplatform.netlify.app while Netlify forwards requests to the backend site.
[[redirects]]
  from = "/api/v1/*"
  to = "https://betplatform-api.netlify.app/api/v1/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/v1"
  to = "https://betplatform-api.netlify.app/api/v1"
  status = 200
  force = true
