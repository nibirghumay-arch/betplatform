    <path d="M-30,-30 L30,-30 L0,64 Z" fill="#123a9e" opacity="0.5"/>
    <path d="M0,-64 L-30,-30 L0,20 Z" fill="#ffffff" opacity="0.35"/>
  </g>
  <g filter="url(#bigglow)" transform="translate(300,186) scale(0.6) rotate(-10)">
