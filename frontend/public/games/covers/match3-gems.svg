<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="80%">
      <stop offset="0%" stop-color="#1c2442"/>
      <stop offset="55%" stop-color="#11162b"/>
      <stop offset="100%" stop-color="#070a16"/>
    </radialGradient>
    <linearGradient id="emerald" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7dffd4"/>
      <stop offset="100%" stop-color="#00b06f"/>
    </linearGradient>
    <linearGradient id="ruby" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9db4"/>
      <stop offset="100%" stop-color="#e01e4a"/>
    </linearGradient>
    <linearGradient id="sapphire" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9db8ff"/>
      <stop offset="100%" stop-color="#2456e0"/>
