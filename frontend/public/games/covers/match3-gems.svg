    <path d="M-30,-30 L30,-30 L0,64 Z" fill="#8f0f2a" opacity="0.5"/>
    <path d="M0,-64 L-30,-30 L0,20 Z" fill="#ffffff" opacity="0.35"/>
  </g>
  <g filter="url(#bigglow)" transform="translate(238,108) scale(0.78) rotate(12)">
