  <text x="200" y="252" font-family="Georgia, serif" font-weight="bold" font-size="26" fill="url(#title)" text-anchor="middle" filter="url(#glow)" letter-spacing="3">MATCH 3 GEMS</text>
  <text x="200" y="273" font-family="Arial, sans-serif" font-size="11" fill="#a8b8e8" text-anchor="middle" letter-spacing="5">LINE UP · SHATTER · GET PAID</text>
