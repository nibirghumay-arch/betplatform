<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#3d0f1e"/>
      <stop offset="55%" stop-color="#260a14"/>
      <stop offset="100%" stop-color="#12040a"/>
    </radialGradient>
    <linearGradient id="felt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f7a3d"/>
      <stop offset="100%" stop-color="#0d4a22"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8e4da"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="50%" stop-color="#f0a500"/>
      <stop offset="100%" stop-color="#b87400"/>
    </linearGradient>
    <linearGradient id="chipred" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff5a5a"/>
      <stop offset="50%" stop-color="#d40000"/>
      <stop offset="100%" stop-color="#8b0000"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="50%" stop-color="#fff6d8"/>
      <stop offset="100%" stop-color="#ffd700"/>
    </linearGradient>
  </defs>

  <rect width="400" height="300" fill="url(#bg)"/>
  <ellipse cx="200" cy="215" rx="190" ry="105" fill="url(#felt)" opacity="0.92" filter="url(#softglow)"/>

  <g transform="translate(150,60) rotate(-8 60 80)">
    <rect x="0" y="0" width="120" height="168" rx="10" fill="url(#card)" stroke="#c9c2b2" stroke-width="2"/>
    <rect x="8" y="8" width="104" height="152" rx="7" fill="none" stroke="#b8b0a0" stroke-width="1.5"/>
    <text x="20" y="38" font-family="Georgia, serif" font-weight="bold" font-size="42" fill="#111111">A</text>
    <text x="21" y="66" font-family="Georgia, serif" font-size="30" fill="#111111">♠</text>
    <text x="100" y="152" font-family="Georgia, serif" font-size="20" fill="#111111" text-anchor="end">♠A</text>
  </g>

  <g transform="translate(206,66) rotate(10 60 80)">
    <rect x="0" y="0" width="120" height="168" rx="10" fill="url(#card)" stroke="#c9c2b2" stroke-width="2"/>
    <rect x="8" y="8" width="104" height="152" rx="7" fill="none" stroke="#b8b0a0" stroke-width="1.5"/>
    <text x="20" y="38" font-family="Georgia, serif" font-weight="bold" font-size="42" fill="#e00000">K</text>
    <text x="22" y="66" font-family="Georgia, serif" font-size="30" fill="#e00000">♥</text>
    <text x="100" y="152" font-family="Georgia, serif" font-size="20" fill="#e00000" text-anchor="end">♥K</text>
  </g>

  <g transform="translate(66,196)">
    <circle cx="34" cy="0" r="26" fill="url(#chip)" stroke="#a86400" stroke-width="2" filter="url(#softglow)"/>
    <circle cx="34" cy="0" r="18" fill="none" stroke="#fff3c4" stroke-width="2"/>
    <circle cx="34" cy="0" r="10" fill="none" stroke="#9a5a00" stroke-width="2.5"/>
    <circle cx="54" cy="14" r="26" fill="url(#chipred)" stroke="#7a0000" stroke-width="2"/>
    <circle cx="54" cy="14" r="18" fill="none" stroke="#ffd9d9" stroke-width="2"/>
    <circle cx="54" cy="14" r="10" fill="none" stroke="#5c0000" stroke-width="2.5"/>
    <circle cx="18" cy="16" r="22" fill="url(#chip)" stroke="#a86400" stroke-width="2"/>
    <circle cx="18" cy="16" r="15" fill="none" stroke="#fff3c4" stroke-width="1.8"/>
  </g>

  <text x="200" y="252" font-family="Georgia, serif" font-weight="bold" font-size="27" fill="url(#title)" text-anchor="middle" filter="url(#softglow)" letter-spacing="2">BLACKJACK</text>
  <text x="200" y="273" font-family="Arial, sans-serif" font-size="11" fill="#d9a9a9" text-anchor="middle" letter-spacing="5">HIT 21 · BEAT THE DEALER</text>
</svg>