<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#1e2a4a"/>
      <stop offset="55%" stop-color="#121a33"/>
      <stop offset="100%" stop-color="#070b1c"/>
    </radialGradient>
    <linearGradient id="tile2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe6b3"/>
      <stop offset="100%" stop-color="#f7b733"/>
    </linearGradient>
    <linearGradient id="tile4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffcf7d"/>
      <stop offset="100%" stop-color="#ff9a3d"/>
    </linearGradient>
    <linearGradient id="tile8" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffad7d"/>
      <stop offset="100%" stop-color="#ff5e3d"/>
    </linearGradient>
    <linearGradient id="tile2048" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd76e"/>
      <stop offset="100%" stop-color="#ffa41f"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="50%" stop-color="#fff6d8"/>
      <stop offset="100%" stop-color="#ffd700"/>
    </linearGradient>
  </defs>

  <rect width="400" height="300" fill="url(#bg)"/>

  <ellipse cx="200" cy="210" rx="170" ry="90" fill="#ffa41f" opacity="0.10" filter="url(#softglow)"/>

  <g transform="translate(92,54)" filter="url(#glow)">
