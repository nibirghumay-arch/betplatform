  <g font-family="Arial Black, Arial, sans-serif" font-weight="900" fill="#5c2d03" text-anchor="middle" filter="url(#softglow)">
    <text x="116" y="35" font-size="24">2</text>
    <text x="170" y="35" font-size="24">4</text>
    <text x="224" y="35" font-size="24">2</text>
    <text x="278" y="35" font-size="24">8</text>
    <text x="116" y="89" font-size="24">8</text>
    <text x="170" y="89" font-size="24">2</text>
    <text x="224" y="89" font-size="24">4</text>
    <text x="278" y="89" font-size="24">2</text>
    <text x="116" y="143" font-size="24">4</text>
    <text x="170" y="143" font-size="24">8</text>
    <text x="224" y="143" font-size="24">2</text>
