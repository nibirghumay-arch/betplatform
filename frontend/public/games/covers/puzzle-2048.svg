    <rect x="54" y="0"  width="48" height="48" rx="10" fill="url(#tile4)"/>
    <rect x="108" y="0" width="48" height="48" rx="10" fill="url(#tile2)"/>
    <rect x="162" y="0" width="48" height="48" rx="10" fill="url(#tile8)"/>
    <rect x="0"  y="54" width="48" height="48" rx="10" fill="url(#tile8)"/>
    <rect x="54" y="54" width="48" height="48" rx="10" fill="url(#tile2)"/>
    <rect x="108" y="54" width="48" height="48" rx="10" fill="url(#tile4)"/>
    <rect x="162" y="54" width="48" height="48" rx="10" fill="url(#tile2)"/>
    <rect x="0"  y="108" width="48" height="48" rx="10" fill="url(#tile4)"/>
    <rect x="54" y="108" width="48" height="48" rx="10" fill="url(#tile8)"/>
    <rect x="108" y="108" width="48" height="48" rx="10" fill="url(#tile2)"/>
    <rect x="162" y="108" width="48" height="48" rx="10" fill="url(#tile4)"/>
    <rect x="0"  y="162" width="48" height="48" rx="10" fill="url(#tile2)"/>
