<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#3a1a3d"/>
      <stop offset="50%" stop-color="#241026"/>
      <stop offset="100%" stop-color="#120813"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffec9e"/>
      <stop offset="45%" stop-color="#ffcf3d"/>
      <stop offset="100%" stop-color="#c87f00"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#cfe3ff"/>
      <stop offset="100%" stop-color="#8fb4e8"/>
    </linearGradient>
    <linearGradient id="cherry" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff5a6e"/>
      <stop offset="100%" stop-color="#c81e3a"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigglow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="50%" stop-color="#fff6d8"/>
      <stop offset="100%" stop-color="#ffd700"/>
    </linearGradient>
  </defs>

  <rect width="400" height="300" fill="url(#bg)"/>

  <g stroke="#ffd700" stroke-width="2.5" opacity="0.9" filter="url(#glow)">
    <path d="M40,60 l-6,-11 11,3 5,-10 5,10 11,-3 -6,11 8,8 -11,2 0,11 -8,-6 -8,6 0,-11 -11,-2 Z"/>
    <path d="M356,70 l-6,-11 11,3 5,-10 5,10 11,-3 -6,11 8,8 -11,2 0,11 -8,-6 -8,6 0,-11 -11,-2 Z"/>
  </g>

  <g filter="url(#bigglow)">
    <rect x="72" y="46" width="256" height="150" rx="18" fill="#1d0f20" stroke="#ffd700" stroke-width="3"/>
    <rect x="84" y="58" width="232" height="126" rx="12" fill="none" stroke="#7a4a00" stroke-width="2"/>
  </g>

  <g filter="url(#glow)">
    <text x="116" y="110" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="52" fill="url(#silver)">7</text>
    <circle cx="166" cy="98" r="15" fill="url(#cherry)"/>
    <circle cx="184" cy="104" r="15" fill="url(#cherry)"/>
    <text x="240" y="110" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="46" fill="url(#gold)">$</text>
  </g>

  <g transform="translate(296,102)" filter="url(#glow)">
    <path d="M0,-24 L24,24 L-24,24 Z" fill="url(#silver)"/>
    <path d="M0,-24 L24,24 L-24,24 Z" fill="none" stroke="#77a4d8" stroke-width="1.5"/>
    <rect x="-8" y="24" width="16" height="30" rx="3" fill="#b8ceea" opacity="0.6"/>
    <text y="15" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="11" fill="#4472a4">◆</text>
  </g>

  <g filter="url(#glow)">
    <text x="200" y="236" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="26" fill="url(#title)" letter-spacing="3">SLOT DELUXE</text>
    <text x="200" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#e8b8d8" letter-spacing="5">GOLD REELS · DIAMOND WINNINGS</text>
    <text x="200" y="282" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="10" fill="#ffcf3d" letter-spacing="6">★ LUXURY JACKPOTS ★</text>
  </g>
</svg>