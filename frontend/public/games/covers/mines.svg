<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#2a2a38"/>
      <stop offset="55%" stop-color="#16161f"/>
      <stop offset="100%" stop-color="#08080d"/>
    </radialGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3d3d52"/>
      <stop offset="100%" stop-color="#24242f"/>
    </linearGradient>
    <radialGradient id="gold" cx="40%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#fff2b0"/>
      <stop offset="45%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#a86a00"/>
    </radialGradient>
    <linearGradient id="redx" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff5a5a"/>
      <stop offset="100%" stop-color="#b00000"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigglow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="50%" stop-color="#fff6d8"/>
      <stop offset="100%" stop-color="#ffd700"/>
    </linearGradient>
  </defs>

  <rect width="400" height="300" fill="url(#bg)"/>
  <ellipse cx="200" cy="206" rx="170" ry="80" fill="#ffd700" opacity="0.08" filter="url(#bigglow)"/>

  <g filter="url(#glow)">
    <rect x="60"  y="58"  width="54" height="54" rx="9" fill="url(#tile)" stroke="#4e4e68" stroke-width="1.5"/>
    <rect x="122" y="58"  width="54" height="54" rx="9" fill="url(#tile)" stroke="#4e4e68" stroke-width="1.5"/>
    <rect x="184" y="58"  width="54" height="54" rx="9" fill="url(#tile)" stroke="#4e4e68" stroke-width="1.5"/>
    <rect x="246" y="58"  width="54" height="54" rx="9" fill="url(#tile)" stroke="#4e4e68" stroke-width="1.5"/>
    <rect x="304" y="58" width="38" height="54" rx="9" fill="url(#tile)" stroke="#4e4e68" stroke-width="1.5"/>

    <rect x="60"  y="119" width="54" height="54" rx="9" fill="url(#tile)" stroke="#4e4e68" stroke-width="1.5"/>
    <rect x="184" y="119" width="54" height="54" rx="9" fill="#8b2222" stroke="#d13a3a" stroke-width="2"/>
    <rect x="246" y="119" width="54" height="54" rx="9" fill="url(#tile)" stroke="#4e4e68" stroke-width="1.5"/>

    <rect x="60"  y="180" width="54" height="54" rx="9" fill="url(#tile)" stroke="#4e4e68" stroke-width="1.5"/>
    <rect x="122" y="180" width="54" height="54" rx="9" fill="url(#tile)" stroke="#4e4e68" stroke-width="1.5"/>
    <rect x="246" y="180" width="54" height="54" rx="9" fill="#14614b" stroke="#2fd09a" stroke-width="2"/>
  </g>

  <g transform="translate(246,146)" filter="url(#glow)">
    <path d="M0,-20 L20,20 L-20,20 Z" fill="url(#gold)"/>
    <text y="12" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="16" fill="#6b4400">$</text>
  </g>

  <g transform="translate(211,146)" filter="url(#glow)">
    <circle cx="0" cy="0" r="19" fill="#1d1d26" stroke="#b00000" stroke-width="2"/>
    <path d="M-11,-11 L11,11 M11,-11 L-11,11" stroke="url(#redx)" stroke-width="6" stroke-linecap="round"/>
  </g>

  <g font-family="Arial, sans-serif" font-weight="bold" text-anchor="middle">
    <text x="87"  y="94"  font-size="22" fill="#b8562a">!</text>
    <text x="149" y="94"  font-size="22" fill="#b8562a">?</text>
    <text x="273" y="94"  font-size="22" fill="#b8562a">?</text>
    <text x="87"  y="154" font-size="22" fill="#b8562a">?</text>
    <text x="273" y="154" font-size="22" fill="#b8562a">?</text>
    <text x="87"  y="216" font-size="22" fill="#b8562a">!</text>
    <text x="149" y="216" font-size="22" fill="#b8562a">?</text>
  </g>

  <text x="200" y="252" font-family="Georgia, serif" font-weight="bold" font-size="26" fill="url(#title)" text-anchor="middle" filter="url(#glow)" letter-spacing="4">MINES</text>
  <text x="200" y="273" font-family="Arial, sans-serif" font-size="11" fill="#9aa0b8" text-anchor="middle" letter-spacing="5">AVOID THE BLAST · CASH OUT</text>
</svg>